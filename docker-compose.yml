version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: author_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: author_website
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: author_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: author_backend
    ports:
      - "5000:5000"
    environment:
      USER: postgres
      HOST: postgres
      DATABASE: author_website
      PASSWORD: password
      DATABASE_PORT: 5432
      JWT_SECRET: super_secret_production_key_12345
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: author_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
